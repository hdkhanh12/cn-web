<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7edf6">
  <meta name="description" content="Một lá thư sau buổi hẹn.">
  <title>Lần đầu gặp gỡ</title>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <main class="experience" id="experience" aria-label="Lá thư gửi em">
    <div class="scene-current" id="scene-current" aria-live="polite"></div>
    <div class="scene-turn" id="scene-turn" aria-hidden="true" hidden></div>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <button class="music-toggle" id="music-toggle" type="button" aria-label="Bật nhạc" title="Bật nhạc" aria-pressed="false" hidden>♫</button>
    <nav class="page-nav" aria-label="Điều hướng lá thư">
      <button class="nav-arrow" id="previous-page" type="button" aria-label="Trang trước" title="Trang trước" disabled>←</button>
      <span class="page-counter" id="page-counter">01 / 06</span>
      <button class="nav-arrow" id="next-page" type="button" aria-label="Trang tiếp" title="Trang tiếp">→</button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <audio id="background-music" preload="none" loop></audio>

  <template id="cover-template">
    <section class="scene scene-cover" aria-label="Bìa thư">
      <div class="cover-lines" aria-hidden="true"></div>
      <span class="cover-index">no 01</span>
      <div class="cover-copy">
        <div class="envelope-art" aria-hidden="true"><span class="envelope-letter"></span><span class="envelope-flap"></span></div>
        <button class="primary-button" type="button" data-next>Mở thư <span aria-hidden="true">↗</span></button>
      </div>
    </section>
  </template>

  <template id="letter-template">
    <section class="scene scene-letter" aria-label="Lời nhắn">
      <span class="scene-number">01 / lời nhắn</span>
      <div class="letter-body">
        <h2>Gửi Hà Anh,</h2>
        <p class="letter-note"></p>
        <div class="memory-note" hidden><p class="memory-copy"></p></div>
        <div class="signature"><span>Thân mến,</span><span>hdk</span></div>
      </div>
    </section>
  </template>

  <template id="photo-template">
    <section class="scene scene-photo" aria-label="Ảnh kỷ niệm">
      <span class="scene-number">02 / khoảnh khắc</span>
      <div class="photo-layout">
        <div class="photo-frame">
          <div class="photo-art" aria-hidden="true"><span>somewhere between<br>hello and goodnight</span></div>
          <img class="memory-photo" alt="Ảnh kỷ niệm buổi hẹn" hidden>
          <button class="photo-next" id="photo-next" type="button" aria-label="Mở ảnh tiếp theo" title="Mở ảnh tiếp theo" hidden><span aria-hidden="true">→</span></button>
        </div>
        <div class="photo-words"><h2>Us.</h2><p class="photo-caption"></p><p class="photo-count" id="photo-count" hidden></p></div>
      </div>
    </section>
  </template>

  <template id="choices-template">
    <section class="scene scene-choices" aria-label="Hai câu hỏi nhỏ">
      <span class="scene-number">03 / vài câu hỏi nhỏ</span>
      <div class="choices-body">
        <h2>Cho anh hỏi nhanh em hai điều nhé?</h2>
        <fieldset class="question"><legend>Nếu phải dùng ba từ để tả buổi hôm nay, em sẽ chọn gì?</legend>
          <textarea id="answer-three-words" data-answer="threeWords" aria-label="Ba từ tả buổi hôm nay" rows="2" maxlength="240"></textarea>
        </fieldset>
        <fieldset class="question"><legend>Điều em thích nhất ở buổi hẹn này?</legend>
          <textarea id="answer-favorite-part" data-answer="favoritePart" aria-label="Điều em thích nhất ở buổi hẹn này" rows="2" maxlength="500"></textarea>
        </fieldset>
      </div>
    </section>
  </template>

  <template id="reply-template">
    <section class="scene scene-reply" aria-label="Lời nhắn của em">
      <span class="scene-number">04 / này em</span>
      <div class="reply-body">
        <h2>Em có muốn nhắn nhủ hay chia sẻ thêm điều gì với anh không?</h2>
        <label class="reply-label" for="reply-text">Lời nhắn của em</label>
        <textarea id="reply-text" data-answer="message" maxlength="800" rows="4"></textarea>
        <button id="send-reply" class="primary-button send-button" type="button">Gửi anh</button>
        <p id="send-status" class="send-status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </template>

  <template id="thanks-template">
    <section class="scene scene-thanks" aria-label="Lời kết">
      <span class="scene-number">05 / the end</span>
      <div class="thanks-body"><h2>Anh nhận được rùi</h2><p>Cảm ơn em đã chia sẻ, anh rất mong lần gặp tới đấy.</p></div>
    </section>
  </template>

  <script src="./config.js?v=4"></script>
  <script src="./app.js?v=4"></script>
</body>
</html>
