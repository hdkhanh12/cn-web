<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9eadc">
  <meta name="description" content="Một lá thư sau buổi hẹn.">
  <title>Một buổi tối, được giữ lại</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="experience" id="experience" aria-label="Lá thư gửi em">
    <div class="scene-current" id="scene-current" aria-live="polite"></div>
    <div class="scene-turn" id="scene-turn" aria-hidden="true" hidden></div>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <button class="music-toggle" id="music-toggle" type="button" aria-label="Bật nhạc" title="Bật nhạc" aria-pressed="false" hidden>♫</button>
    <nav class="page-nav" aria-label="Điều hướng lá thư">
      <button class="nav-arrow" id="previous-page" type="button" aria-label="Trang trước" title="Trang trước" disabled>←</button>
      <span class="page-counter" id="page-counter">01 / 07</span>
      <button class="nav-arrow" id="next-page" type="button" aria-label="Trang tiếp" title="Trang tiếp">→</button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <audio id="background-music" preload="none" loop></audio>

  <template id="cover-template">
    <section class="scene scene-cover" aria-label="Bìa thư">
      <div class="cover-lines" aria-hidden="true"></div>
      <span class="cover-index">một lá thư / 01</span>
      <div class="cover-copy">
        <p class="eyebrow">SAU BUỔI HẸN</p>
        <h1>Một buổi tối,<br><em>được giữ lại.</em></h1>
        <p>Anh để dành vài dòng cho em.</p>
        <button class="primary-button" type="button" data-next>Mở thư <span aria-hidden="true">↗</span></button>
      </div>
      <div class="cover-seal" aria-hidden="true">✳</div>
    </section>
  </template>

  <template id="letter-template">
    <section class="scene scene-letter" aria-label="Lời nhắn">
      <span class="scene-number">01 / lời nhắn</span>
      <div class="letter-body">
        <h2>Gửi em,</h2>
        <p class="letter-note"></p>
        <div class="memory-note" hidden><p class="memory-copy"></p></div>
        <p class="signature">Anh.</p>
      </div>
      <span class="letter-doodle" aria-hidden="true">✳</span>
    </section>
  </template>

  <template id="photo-template">
    <section class="scene scene-photo" aria-label="Ảnh kỷ niệm">
      <span class="scene-number">02 / khoảnh khắc</span>
      <div class="photo-layout">
        <div class="photo-frame">
          <div class="photo-art" aria-hidden="true"><span>somewhere between<br>hello and goodnight</span></div>
          <img class="memory-photo" alt="Ảnh kỷ niệm buổi hẹn" hidden>
        </div>
        <div class="photo-words"><span class="photo-asterisk" aria-hidden="true">✳</span><h2>Một khoảnh khắc nhỏ,<br>để dành ở đây.</h2><p class="photo-caption"></p></div>
      </div>
    </section>
  </template>

  <template id="invitation-template">
    <section class="scene scene-invitation" aria-label="Lời mời">
      <span class="scene-number">03 / một lời mời</span>
      <div class="invitation-body">
        <p class="eyebrow">NẾU CÒN MỘT TRANG NỮA...</p>
        <h2>Nếu em cũng thấy vui,<br><em>mình hẹn thêm một buổi nhé?</em></h2>
        <p>Không cần quyết định ngay. Anh chỉ muốn em biết là anh sẵn lòng.</p>
        <button class="primary-button" type="button" data-next>Em xem tiếp nhé <span aria-hidden="true">↗</span></button>
      </div>
      <span class="invitation-flower" aria-hidden="true">✳</span>
    </section>
  </template>

  <template id="choices-template">
    <section class="scene scene-choices" aria-label="Hai câu hỏi nhỏ">
      <span class="scene-number">04 / vài điều nhỏ</span>
      <div class="choices-body">
        <p class="eyebrow">KHÔNG CẦN NGHĨ LÂU ĐÂU</p>
        <h2>Cho anh hỏi hai câu nhé?</h2>
        <fieldset class="question" data-question="feeling"><legend>Nếu chọn một từ cho buổi hôm ấy, em chọn gì?</legend>
          <div class="option-list"><label><input type="radio" name="feeling" value="Ấm áp"><span>Ấm áp</span></label><label><input type="radio" name="feeling" value="Vui"><span>Vui</span></label><label><input type="radio" name="feeling" value="Bất ngờ"><span>Bất ngờ</span></label><label><input type="radio" name="feeling" value="Khó tả"><span>Khó tả</span></label></div>
        </fieldset>
        <fieldset class="question" data-question="nextDate"><legend>Nếu có buổi tiếp theo, em thích mình làm gì?</legend>
          <div class="option-list"><label><input type="radio" name="nextDate" value="Cà phê"><span>Cà phê</span></label><label><input type="radio" name="nextDate" value="Đi dạo"><span>Đi dạo</span></label><label><input type="radio" name="nextDate" value="Xem phim"><span>Xem phim</span></label><label><input type="radio" name="nextDate" value="Để hôm đó chọn"><span>Để hôm đó chọn</span></label></div>
        </fieldset>
        <p class="optional-hint">Thích thì chọn, không thì cứ lật tiếp nhé.</p>
      </div>
    </section>
  </template>

  <template id="reply-template">
    <section class="scene scene-reply" aria-label="Lời nhắn của em">
      <span class="scene-number">05 / đến lượt em</span>
      <div class="reply-body">
        <p class="eyebrow">MỘT CHÚT TỪ EM</p>
        <h2>Có điều gì em muốn kể thêm với anh không?</h2>
        <label class="reply-label" for="reply-text">Lời nhắn của em <span>(không bắt buộc)</span></label>
        <textarea id="reply-text" maxlength="800" rows="4" placeholder="Viết gì cũng được, hoặc để trống nhé."></textarea>
        <p class="privacy-note">Chỉ anh xem được câu trả lời em gửi. Em có thể để trống tất cả.</p>
        <button id="send-reply" class="primary-button send-button" type="button">Gửi anh nhé <span aria-hidden="true">↗</span></button>
        <p id="send-status" class="send-status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </template>

  <template id="thanks-template">
    <section class="scene scene-thanks" aria-label="Lời kết">
      <span class="scene-number">06 / để dành</span>
      <div class="thanks-body"><span class="thanks-mark" aria-hidden="true">✳</span><h2>Anh nhận được rồi.</h2><p>Cảm ơn em đã để lại vài dòng. Phần còn lại, mình cứ từ từ nhé.</p></div>
    </section>
  </template>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
